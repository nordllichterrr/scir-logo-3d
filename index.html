<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR — True 3D Unicorn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow: hidden;
        }

        h1 {
            margin-top: 20px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
            z-index: 10;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 95vw;
            height: 70vh;
            margin-top: 20px;
        }

        .card {
            position: relative;
            border-radius: 24px;
            background: rgba(15, 23, 48, 0.4);
            border: 1px solid #26325a;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .label {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 1rem;
            color: #94a3c4;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>SCIR — True 3D Geometry</h1>

    <div class="grid">
        <div class="card" id="card1">
            <div class="label">Линейная перспектива</div>
        </div>
        <div class="card" id="card2">
            <div class="label">Обратная перспектива</div>
        </div>
        <div class="card" id="card3">
            <div class="label">Воздушная перспектива</div>
        </div>
    </div>

    <script>
        function createUnicornScene(containerId, perspectiveType) {
            const container = document.getElementById(containerId);
            
            const scene = new THREE.Scene();
            if (perspectiveType === 'atmospheric') {
                scene.fog = new THREE.FogExp2(0x070b16, 0.02);
            }

            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // --- СВЕТ ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(5, 5, 5);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x2EC4A6, 0.6);
            dirLight2.position.set(-5, 0, 5);
            scene.add(dirLight2);

            const pointLight = new THREE.PointLight(0x8B5CF6, 1, 10);
            pointLight.position.set(0, 2, 2);
            scene.add(pointLight);

            // --- МОДЕЛЬ ГОЛОВЫ ---
            const unicornGroup = new THREE.Group();

            // Материал (белый, матовый)
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 0.3, 
                metalness: 0.1 
            });

            // 1. Морда (вытянутая сфера)
            const headGeo = new THREE.SphereGeometry(1, 32, 32);
            const head = new THREE.Mesh(headGeo, material);
            head.scale.set(1.1, 1.5, 1.1); 
            head.position.set(0, 0, 0);
            unicornGroup.add(head);

            // 2. Ухо
            const earGeo = new THREE.ConeGeometry(0.3, 0.8, 16);
            const ear = new THREE.Mesh(earGeo, material);
            ear.position.set(0.6, 1.3, 0);
            ear.rotation.z = -0.3;
            unicornGroup.add(ear);

            // 3. Рог (светящийся)
            const hornMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2EC4A6, 
                emissive: 0x2EC4A6, 
                emissiveIntensity: 0.8,
                roughness: 0.1
            });
            const hornGeo = new THREE.ConeGeometry(0.15, 2, 16);
            const horn = new THREE.Mesh(hornGeo, hornMaterial);
            horn.position.set(0, 1.8, 0.3);
            horn.rotation.x = 0.15;
            unicornGroup.add(horn);

            // 4. Грива (набор сфер)
            const maneMaterial = new THREE.MeshStandardMaterial({ color: 0x8B5CF6 });
            for(let i=0; i<6; i++) {
                const manePart = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), maneMaterial);
                manePart.position.set(-0.9, 1 - i*0.4, -0.2 + i*0.15);
                manePart.scale.set(0.6, 1.2, 0.6);
                manePart.rotation.x = i * 0.2;
                unicornGroup.add(manePart);
            }

            // 5. Глаз
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x070b16 });
            const eyeGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const eye = new THREE.Mesh(eyeGeo, eyeMaterial);
            eye.position.set(0.8, 0.4, 0.8);
            unicornGroup.add(eye);

            scene.add(unicornGroup);

            // --- НАСТРОЙКА КАМЕРЫ ---
            if (perspectiveType === 'linear') {
                camera.position.set(0, 1, 8);
                camera.lookAt(0, 0.5, 0);
            } else if (perspectiveType === 'reverse') {
                camera.fov = 75; // Широкий угол
                camera.position.set(0, 3, 5);
                camera.lookAt(0, 0, 0);
                camera.updateProjectionMatrix();
                unicornGroup.rotation.x = -0.4;
                unicornGroup.rotation.y = 0.6;
            } else if (perspectiveType === 'atmospheric') {
                camera.fov = 30; // Узкий угол
                camera.position.set(0, 1, 15); 
                camera.lookAt(0, 0.5, 0);
                camera.updateProjectionMatrix();
                unicornGroup.rotation.y = -0.5;
                unicornGroup.rotation.z = 0.1;
                
                material.transparent = true;
                material.opacity = 0.6;
                maneMaterial.transparent = true;
                maneMaterial.opacity = 0.5;
            }

            // --- АНИМАЦИЯ ---
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.01;
                
                if (perspectiveType === 'linear') {
                    unicornGroup.rotation.y = Math.sin(time) * 0.3;
                } else if (perspectiveType === 'reverse') {
                    unicornGroup.rotation.y = 0.6 + Math.sin(time) * 0.4; 
                } else {
                    unicornGroup.rotation.y = -0.5 + Math.sin(time) * 0.2;
                }

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        createUnicornScene('card1', 'linear');
        createUnicornScene('card2', 'reverse');
        createUnicornScene('card3', 'atmospheric');
    </script>
</body>
</html>
