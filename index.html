<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR 3D Logo — Perspectives</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            perspective: 1200px;
        }

        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 24px;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 0 40px rgba(91, 140, 255, 0.3);
            border-color: #5b8cff;
        }

        .card h3 {
            margin-top: 30px;
            font-size: 1.3rem;
            color: #94a3c4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
            position: relative;
            width: 200px;
            height: 200px;
        }

        /* --- ОБЪЕМНЫЙ ЕДИНОРОГ (CSS ART) --- */
        .unicorn-head {
            width: 100px;
            height: 120px;
            background: linear-gradient(135deg, #ffffff 0%, #d1d9e6 100%);
            border-radius: 50% 50% 20% 20%;
            position: relative;
            z-index: 3;
            box-shadow: 
                inset -10px -10px 20px rgba(0,0,0,0.2),
                inset 10px 10px 20px rgba(255,255,255,0.8),
                0 20px 30px rgba(0,0,0,0.5);
            transform: translateZ(30px);
        }

        /* Ухо */
        .unicorn-head::before {
            content: '';
            position: absolute;
            top: -10px;
            right: 10px;
            width: 20px;
            height: 30px;
            background: #ffffff;
            border-radius: 50% 50% 0 0;
            transform: rotate(20deg);
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1);
        }

        /* Рог */
        .unicorn-horn {
            position: absolute;
            top: -40px;
            left: 40px;
            width: 20px;
            height: 50px;
            background: linear-gradient(to top, #2EC4A6, #8B5CF6);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            z-index: 4;
            transform: translateZ(40px) rotate(-10deg);
            box-shadow: 0 0 20px #2EC4A6;
        }

        /* Грива */
        .unicorn-mane {
            position: absolute;
            top: 20px;
            left: -40px;
            width: 60px;
            height: 100px;
            background: linear-gradient(135deg, #8B5CF6, #2EC4A6);
            border-radius: 50% 20% 20% 50%;
            z-index: 2;
            transform: translateZ(10px) rotate(-15deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            filter: blur(0.5px);
        }

        /* Тень под единорогом */
        .unicorn-shadow {
            position: absolute;
            bottom: -20px;
            width: 120px;
            height: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            filter: blur(10px);
            transform: translateZ(-10px);
            z-index: 1;
        }

        /* Текст SCIR */
        .text-scir {
            margin-top: 30px;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 209, 178, 0.8);
            transform: translateZ(50px);
            z-index: 5;
        }

        /* --- ПЕРСПЕКТИВЫ --- */
        
        /* 1. Линейная */
        .linear .logo-container {
            transform: rotateY(0deg) rotateX(0deg);
        }

        /* 2. Обратная (сужается к зрителю) */
        .reverse .logo-container {
            transform: rotateY(-25deg) rotateX(15deg) scale(1.1);
        }
        .reverse .unicorn-head {
            transform: translateZ(60px);
        }

        /* 3. Воздушная (размытие и дымка) */
        .atmospheric .logo-container {
            filter: blur(1.5px);
        }
        .atmospheric .unicorn-head {
            opacity: 0.85;
            filter: blur(1px) drop-shadow(0 0 30px #00d1b2);
        }
        .atmospheric .unicorn-mane {
            opacity: 0.7;
            filter: blur(3px);
        }
        .atmospheric .unicorn-horn {
            opacity: 0.6;
            filter: blur(2px);
        }
        .atmospheric .text-scir {
            opacity: 0.7;
            filter: blur(2px);
        }
    </style>
</head>
<body>

    <h1>SCIR Logo Perspectives</h1>

    <div class="grid">
        <!-- Карточка 1: Линейная -->
        <div class="card linear">
            <div class="logo-container">
                <div class="unicorn-shadow"></div>
                <div class="unicorn-mane"></div>
                <div class="unicorn-head"></div>
                <div class="unicorn-horn"></div>
            </div>
            <div class="text-scir">SCIR</div>
            <h3>Линейная перспектива</h3>
        </div>

        <!-- Карточка 2: Обратная -->
        <div class="card reverse">
            <div class="logo-container">
                <div class="unicorn-shadow"></div>
                <div class="unicorn-mane"></div>
                <div class="unicorn-head"></div>
                <div class="unicorn-horn"></div>
            </div>
            <div class="text-scir">SCIR</div>
            <h3>Обратная перспектива</h3>
        </div>

        <!-- Карточка 3: Воздушная -->
        <div class="card atmospheric">
            <div class="logo-container">
                <div class="unicorn-shadow"></div>
                <div class="unicorn-mane"></div>
                <div class="unicorn-head"></div>
                <div class="unicorn-horn"></div>
            </div>
            <div class="text-scir">SCIR</div>
            <h3>Воздушная перспектива</h3>
        </div>
    </div>

</body>
</html>
