<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR 3D Unicorn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            perspective: 1000px; /* Перспектива для сетки */
        }

        /* Фон карточки строго плоский */
        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            transform-style: flat;
        }

        .card h3 {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #94a3c4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Контейнер для 3D-сцены (только он вращается) */
        .unicorn-scene {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        /* --- РИСУЕМ ГОЛОВУ ЕДИНОРОГА КОДОМ --- */
        .unicorn {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }

        /* Морда (смещенный овал с объемной тенью) */
        .head {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 100px;
            height: 120px;
            background: linear-gradient(135deg, #ffffff 0%, #d1d9e6 100%);
            border-radius: 50% 50% 40% 20%;
            box-shadow: 
                inset -10px -10px 20px rgba(0,0,0,0.1),
                inset 10px 10px 20px rgba(255,255,255,0.8),
                0 20px 30px rgba(0,0,0,0.5);
            transform: translateZ(30px);
            z-index: 3;
        }

        /* Ухо */
        .ear {
            position: absolute;
            top: 20px;
            left: 110px;
            width: 25px;
            height: 40px;
            background: #ffffff;
            border-radius: 50% 50% 0 0;
            transform: rotate(25deg) translateZ(30px);
            z-index: 2;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1);
        }

        /* Глаз */
        .eye {
            position: absolute;
            top: 80px;
            left: 110px;
            width: 12px;
            height: 16px;
            background: #070b16;
            border-radius: 50%;
            transform: translateZ(40px);
            z-index: 5;
            box-shadow: 0 0 10px rgba(0,209,178,0.8);
        }

        /* Рог (светящийся градиент) */
        .horn {
            position: absolute;
            top: -30px;
            left: 80px;
            width: 30px;
            height: 90px;
            background: linear-gradient(to top, #2EC4A6, #8B5CF6);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: translateZ(50px) rotate(-15deg);
            z-index: 4;
            box-shadow: 0 0 20px #2EC4A6;
        }

        /* Грива (несколько слоев) */
        .mane-1, .mane-2, .mane-3 {
            position: absolute;
            background: linear-gradient(135deg, #8B5CF6, #2EC4A6);
            border-radius: 50%;
        }

        .mane-1 {
            top: 50px;
            left: 10px;
            width: 70px;
            height: 120px;
            transform: translateZ(10px) rotate(-15deg);
            filter: blur(1px);
            opacity: 0.9;
        }

        .mane-2 {
            top: 70px;
            left: -10px;
            width: 50px;
            height: 100px;
            transform: translateZ(5px) rotate(-30deg);
            filter: blur(2px);
            opacity: 0.7;
        }

        .mane-3 {
            top: 30px;
            left: 20px;
            width: 60px;
            height: 110px;
            transform: translateZ(15px) rotate(0deg);
            filter: blur(0.5px);
            opacity: 0.8;
        }

        /* --- ПЕРСПЕКТИВЫ --- */
        
        /* 1. Линейная */
        .linear .unicorn-scene {
            transform: rotateY(0deg) rotateX(0deg);
        }

        /* 2. Обратная (вылет вперед) */
        .reverse .unicorn-scene {
            transform: rotateY(-25deg) rotateX(15deg) scale(1.1);
        }
        .reverse .head, .reverse .ear, .reverse .eye {
            transform: translateZ(60px);
        }
        .reverse .horn {
            transform: translateZ(80px) rotate(-15deg);
        }

        /* 3. Воздушная (уходит вглубь) */
        .atmospheric .unicorn-scene {
            transform: rotateY(15deg) rotateX(-10deg) scale(0.95);
        }
        .atmospheric .unicorn {
            filter: blur(2px);
            opacity: 0.7;
        }
        .atmospheric .horn {
            filter: blur(1px);
            box-shadow: 0 0 40px #2EC4A6;
        }

        /* Текст SCIR (плоский, под сценой) */
        .text-scir {
            margin-top: 30px;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.8);
        }
    </style>
</head>
<body>

    <h1>SCIR 3D Unicorn</h1>

    <div class="grid">
        <!-- 1. Линейная -->
        <div class="card linear">
            <div class="unicorn-scene">
                <div class="unicorn">
                    <div class="mane-3"></div>
                    <div class="mane-2"></div>
                    <div class="mane-1"></div>
                    <div class="head"></div>
                    <div class="ear"></div>
                    <div class="eye"></div>
                    <div class="horn"></div>
                </div>
            </div>
            <div class="text-scir">SCIR</div>
            <h3>Линейная</h3>
        </div>

        <!-- 2. Обратная -->
        <div class="card reverse">
            <div class="unicorn-scene">
                <div class="unicorn">
                    <div class="mane-3"></div>
                    <div class="mane-2"></div>
                    <div class="mane-1"></div>
                    <div class="head"></div>
                    <div class="ear"></div>
                    <div class="eye"></div>
                    <div class="horn"></div>
                </div>
            </div>
            <div class="text-scir">SCIR</div>
            <h3>Обратная</h3>
        </div>

        <!-- 3. Воздушная -->
        <div class="card atmospheric">
            <div class="unicorn-scene">
                <div class="unicorn">
                    <div class="mane-3"></div>
                    <div class="mane-2"></div>
                    <div class="mane-1"></div>
                    <div class="head"></div>
                    <div class="ear"></div>
                    <div class="eye"></div>
                    <div class="horn"></div>
                </div>
            </div>
            <div class="text-scir">SCIR</div>
            <h3>Воздушная</h3>
        </div>
    </div>

</body>
</html>
