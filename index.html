<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR Logo Perspectives</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            perspective: 1000px;
        }

        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 20px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 350px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 0 30px rgba(91, 140, 255, 0.2);
            border-color: #5b8cff;
        }

        .card h3 {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #94a3c4;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
            width: 100%;
        }

        /* ТВОЙ ЛОГОТИП */
        .logo-img {
            width: 280px;
            height: 160px;
            background-image: url('logo1.jpg'); /* Твоя картинка */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 10px;
            filter: drop-shadow(0 0 20px rgba(0, 209, 178, 0.6));
            transform: translateZ(20px);
        }

        /* 1. Линейная */
        .linear .logo-container {
            transform: rotateY(0deg) rotateX(0deg);
        }

        /* 2. Обратная */
        .reverse .logo-container {
            transform: rotateY(-20deg) rotateX(15deg) scale(1.1);
        }
        .reverse .logo-img {
            transform: translateZ(60px);
        }

        /* 3. Воздушная */
        .atmospheric .logo-container {
            filter: blur(1px);
        }
        .atmospheric .logo-img {
            filter: blur(2px) drop-shadow(0 0 40px #00d1b2);
            opacity: 0.7;
            transform: translateZ(0px) scale(0.95);
        }

    </style>
</head>
<body>

    <h1>SCIR Logo Perspectives</h1>

    <div class="grid">
        <div class="card linear">
            <div class="logo-container">
                <div class="logo-img"></div>
            </div>
            <h3>Линейная перспектива</h3>
        </div>

        <div class="card reverse">
            <div class="logo-container">
                <div class="logo-img"></div>
            </div>
            <h3>Обратная перспектива</h3>
        </div>

        <div class="card atmospheric">
            <div class="logo-container">
                <div class="logo-img"></div>
            </div>
            <h3>Воздушная перспектива</h3>
        </div>
    </div>

</body>
</html>
