<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR Logo — 3D Perspectives</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            perspective: 1000px;
            margin-bottom: 60px;
        }

        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 20px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 0 30px rgba(91, 140, 255, 0.2);
            border-color: #5b8cff;
        }

        .card h3 {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #94a3c4;
            text-align: center;
            z-index: 10;
        }

        .logo-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
        }

        .unicorn {
            font-size: 80px;
            filter: drop-shadow(0 0 15px rgba(0, 209, 178, 0.8));
            transform: translateZ(20px);
            z-index: 2;
            animation: float 4s ease-in-out infinite;
        }

        .gamma {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff5b8c;
            color: #070b16;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            box-shadow: 0 0 15px #ff5b8c;
            transform: translateZ(30px);
            z-index: 3;
        }

        .text-scir {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-top: 10px;
            transform: translateZ(10px);
            z-index: 1;
        }

        .perspective-linear .logo-container {
            transform: rotateY(0deg) rotateX(0deg);
        }

        .perspective-reverse .logo-container {
            transform: rotateY(-15deg) rotateX(10deg) scale(1.1);
        }
        
        .perspective-reverse .unicorn {
            transform: translateZ(40px) rotateY(10deg);
        }

        .perspective-atmospheric .logo-container {
            filter: blur(1px);
        }

        .perspective-atmospheric .unicorn {
            filter: drop-shadow(0 0 30px rgba(0, 209, 178, 0.9)) blur(0.5px);
            transform: translateZ(10px) scale(0.9);
            opacity: 0.9;
        }

        .perspective-atmospheric .text-scir {
            filter: blur(2px);
            opacity: 0.6;
            transform: translateZ(0px) scale(0.95);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .perspective-atmospheric .gamma {
            filter: blur(1px);
            transform: translateZ(20px) scale(0.9);
            opacity: 0.8;
        }

        @keyframes float {
            0% { transform: translateY(0px) translateZ(20px); }
            50% { transform: translateY(-10px) translateZ(20px); }
            100% { transform: translateY(0px) translateZ(20px); }
        }
    </style>
</head>
<body>

    <h1>SCIR Logo Perspectives</h1>

    <div class="grid">
        <div class="card perspective-linear">
            <div class="logo-container">
                <div class="unicorn">
                    🦄
                    <div class="gamma">γ</div>
                </div>
                <div class="text-scir">SCIR</div>
            </div>
            <h3>Линейная перспектива</h3>
        </div>

        <div class="card perspective-reverse">
            <div class="logo-container">
                <div class="unicorn">
                    🦄
                    <div class="gamma">γ</div>
                </div>
                <div class="text-scir">SCIR</div>
            </div>
            <h3>Обратная перспектива</h3>
        </div>

        <div class="card perspective-atmospheric">
            <div class="logo-container">
                <div class="unicorn">
                    🦄
                    <div class="gamma">γ</div>
                </div>
                <div class="text-scir">SCIR</div>
            </div>
            <h3>Воздушная перспектива</h3>
        </div>
    </div>

</body>
</html>
