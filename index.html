<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR — 2D Perspectives</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1100px;
        }

        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 0 30px rgba(91, 140, 255, 0.2);
            border-color: #5b8cff;
        }

        .card h3 {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #94a3c4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Контейнер для картинки */
        .logo-box {
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 20px;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        /* --- 2D ПЕРСПЕКТИВЫ --- */
        
        /* 1. Линейная (вид спереди) */
        .linear .logo-img {
            transform: rotate(0deg) scale(1);
        }

        /* 2. Обратная (наклон и увеличение) */
        .reverse .logo-img {
            transform: rotate(-15deg) scale(1.2) skewX(10deg);
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        /* 3. Воздушная (сжатие и размытие) */
        .atmospheric .logo-img {
            transform: rotate(10deg) scale(0.85) skewY(-5deg);
            filter: blur(2px) drop-shadow(0 0 30px #00d1b2);
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <h1>SCIR — 2D Perspectives</h1>

    <div class="grid">
        <!-- 1. Линейная -->
        <div class="card linear">
            <div class="logo-box">
                <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Линейная</h3>
        </div>

        <!-- 2. Обратная -->
        <div class="card reverse">
            <div class="logo-box">
                <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Обратная</h3>
        </div>

        <!-- 3. Воздушная -->
        <div class="card atmospheric">
            <div class="logo-box">
                <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Воздушная</h3>
        </div>
    </div>

</body>
</html>
