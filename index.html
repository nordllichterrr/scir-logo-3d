<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR 3D Motion Logo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            /* Глобальная перспектива для всей сцены */
            perspective: 2000px; 
        }

        /* Карточка строго плоская, без 3D */
        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 450px;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            /* Отключаем 3D для фона */
            transform-style: flat;
            transform: translateZ(0);
        }

        .card:hover {
            box-shadow: 0 0 40px rgba(91, 140, 255, 0.3);
            border-color: #5b8cff;
        }

        .card h3 {
            margin-top: 40px;
            font-size: 1.1rem;
            color: #94a3c4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- 3D СЦЕНА ДЛЯ ЛОГОТИПА --- */
        .logo-scene {
            width: 200px;
            height: 200px;
            position: relative;
            /* Только здесь включается 3D */
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Слой для картинки */
        .logo-layer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Включаем сохранение 3D для внутренних элементов */
            transform-style: preserve-3d;
        }

        /* Сама картинка (голова единорога) */
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Вырезаем лишний фон, если он есть */
            mask-image: radial-gradient(circle, black 60%, transparent 65%);
            -webkit-mask-image: radial-gradient(circle, black 60%, transparent 65%);
            
            /* Задаем объем за счет теней и градиентов */
            filter: 
                drop-shadow(0 15px 25px rgba(0,0,0,0.8))
                drop-shadow(0 0 20px rgba(46, 196, 166, 0.4));
        }

        /* --- 3 ПРОФЕССИОНАЛЬНЫЕ ПЕРСПЕКТИВЫ --- */

        /* 1. Линейная (Flat/Front) */
        .linear .logo-scene {
            transform: rotateY(0deg) rotateX(0deg);
        }

        /* 2. Обратная (Extruded / Flying out) */
        .reverse .logo-scene {
            /* Наклоняем сцену */
            transform: rotateY(-30deg) rotateX(15deg) scale(1.1);
        }
        .reverse .logo-img {
            /* Выдвигаем саму голову вперед, создавая объем */
            transform: translateZ(80px);
            filter: 
                drop-shadow(0 30px 40px rgba(0,0,0,0.9))
                drop-shadow(0 0 40px rgba(139, 92, 246, 0.6));
        }

        /* 3. Воздушная (Atmospheric Depth) */
        .atmospheric .logo-scene {
            transform: rotateY(15deg) rotateX(-10deg) scale(0.9);
        }
        .atmospheric .logo-img {
            /* Уводим назад и размываем */
            transform: translateZ(-50px);
            opacity: 0.8;
            filter: 
                blur(3px) 
                drop-shadow(0 0 50px rgba(46, 196, 166, 0.8))
                brightness(1.2);
        }

        /* Легкая анимация парения для всех карточек */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .logo-scene {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <h1>SCIR 3D Motion Perspectives</h1>

    <div class="grid">
        <!-- 1. Линейная -->
        <div class="card linear">
            <div class="logo-scene">
                <div class="logo-layer">
                    <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
                </div>
            </div>
            <h3>Линейная</h3>
        </div>

        <!-- 2. Обратная -->
        <div class="card reverse">
            <div class="logo-scene">
                <div class="logo-layer">
                    <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
                </div>
            </div>
            <h3>Обратная</h3>
        </div>

        <!-- 3. Воздушная -->
        <div class="card atmospheric">
            <div class="logo-scene">
                <div class="logo-layer">
                    <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
                </div>
            </div>
            <h3>Воздушная</h3>
        </div>
    </div>

</body>
</html>
