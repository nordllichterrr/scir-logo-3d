<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR 3D Perspectives</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            perspective: 1500px; /* Общая перспектива для 3D */
        }

        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 0 40px rgba(91, 140, 255, 0.3);
            border-color: #5b8cff;
        }

        .card h3 {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #94a3c4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- ГРУППА ЛОГОТИПА (Только она вертится) --- */
        .logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            width: 260px;
        }

        /* Твой логотип как картинка */
        .logo-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transform: translateZ(20px); /* Выдвигаем логотип вперед */
        }

        /* --- ПЕРСПЕКТИВЫ --- */
        
        /* 1. Линейная (плоская) */
        .linear .logo-group {
            transform: rotateY(0deg) rotateX(0deg);
        }

        /* 2. Обратная (сужается к зрителю) */
        .reverse .logo-group {
            transform: rotateY(-20deg) rotateX(10deg) scale(1.05);
        }
        /* Эффект вылета для обратной перспективы */
        .reverse .logo-img {
            transform: translateZ(60px) scale(1.1);
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.7));
        }

        /* 3. Воздушная (размытие и дымка) */
        .atmospheric .logo-group {
            filter: blur(1px);
        }
        .atmospheric .logo-img {
            opacity: 0.7;
            filter: blur(2px) drop-shadow(0 0 30px #00d1b2);
            transform: translateZ(0px) scale(0.95);
        }
    </style>
</head>
<body>

    <h1>SCIR Logo Perspectives</h1>

    <div class="grid">
        <!-- 1. Линейная -->
        <div class="card linear">
            <div class="logo-group">
                <img src="logo1.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Линейная</h3>
        </div>

        <!-- 2. Обратная -->
        <div class="card reverse">
            <div class="logo-group">
                <img src="logo1.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Обратная</h3>
        </div>

        <!-- 3. Воздушная -->
        <div class="card atmospheric">
            <div class="logo-group">
                <img src="logo1.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Воздушная</h3>
        </div>
    </div>

</body>
</html>
