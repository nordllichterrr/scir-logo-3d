<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIR 3D Logo Perspectives</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 0%, #16204a 0%, #070b16 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #e9edff;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #00d1b2;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            perspective: 1200px; /* Перспектива для 3D */
        }

        /* Карточка плоская */
        .card {
            background: rgba(15, 23, 48, 0.6);
            border: 1px solid #26325a;
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 0 40px rgba(91, 140, 255, 0.3);
            border-color: #5b8cff;
        }

        .card h3 {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #94a3c4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Контейнер для вращения (только он в 3D) */
        .logo-3d-box {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        /* Сама картинка */
        .logo-img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        /* --- ПЕРСПЕКТИВЫ (Вращаем ТОЛЬКО .logo-3d-box) --- */
        
        /* 1. Линейная */
        .linear .logo-3d-box {
            transform: rotateY(0deg) rotateX(0deg);
        }

        /* 2. Обратная */
        .reverse .logo-3d-box {
            transform: rotateY(-25deg) rotateX(15deg) scale(1.05);
        }
        .reverse .logo-img {
            transform: translateZ(50px); /* Вылет вперед */
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.8));
        }

        /* 3. Воздушная */
        .atmospheric .logo-3d-box {
            transform: rotateY(10deg) rotateX(-5deg);
        }
        .atmospheric .logo-img {
            filter: blur(2px) drop-shadow(0 0 40px #00d1b2);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>SCIR Logo Perspectives</h1>

    <div class="grid">
        <!-- 1. Линейная -->
        <div class="card linear">
            <div class="logo-3d-box">
                <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Линейная</h3>
        </div>

        <!-- 2. Обратная -->
        <div class="card reverse">
            <div class="logo-3d-box">
                <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Обратная</h3>
        </div>

        <!-- 3. Воздушная -->
        <div class="card atmospheric">
            <div class="logo-3d-box">
                <img src="logo.jpg" alt="SCIR Logo" class="logo-img">
            </div>
            <h3>Воздушная</h3>
        </div>
    </div>

</body>
</html>
